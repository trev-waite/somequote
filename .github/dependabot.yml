# Workflow actions are pinned to commit SHAs and packages to exact versions, so updates arrive
# only through Dependabot PRs (grouped monthly, plus security fixes), each of which runs the full CI.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  # Security fixes open PRs only for packages in package.json. Transitive ones still raise alerts.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-type: direct
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
