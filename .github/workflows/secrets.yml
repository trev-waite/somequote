name: Secret scan

# Every push to any branch or tag, with no path filters: a commit skipped here would never be
# scanned, because the next push only scans the commits after it. Pull requests are covered by
# the pushes to their branches, and merges by the push to main.
on:
  push:
    branches: ['**']
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group: GitHub keeps only one pending run per group and cancels the one before it,
# even without cancel-in-progress, and a later push scans only its own new commits.

jobs:
  scan:
    name: Secret scan
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      # tools/secret-scan has no dependencies, so nothing is installed.
      - name: Scan the pushed commits and messages
        run: |
          base="$BEFORE"
          # A new branch or tag, a force push past history this clone lacks, or a manual run:
          # scan all history.
          git cat-file -e "${base}^{commit}" 2>/dev/null || base=""
          # A tag is scanned as itself, so an annotated tag's message is checked too.
          head=HEAD
          case "$GITHUB_REF" in refs/tags/*) head="$GITHUB_REF" ;; esac
          bun tools/secret-scan/src/cli.ts "$base" "$head"
        env:
          BEFORE: ${{ github.event.before }}
