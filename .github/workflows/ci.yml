name: CI/CD

# Pull requests run every check, with no path filters: main's ruleset requires these checks, so
# a skipped run would leave a docs-only PR unmergeable. A merge to main runs them again on the
# merged result, then deploys the exact build that passed them; a Markdown-only merge doesn't
# redeploy. Zone settings deploy separately (zone.yml), and secret scanning runs on every push
# without path filters (secrets.yml).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the commits under review
        id: range
        run: |
          base="$PR_BASE"
          [ -n "$base" ] || base="$PUSH_BEFORE"
          # A new branch, force push, or manual run has no usable base: skip the migration check
          # and verify every quote's sources.
          git cat-file -e "${base}^{commit}" 2>/dev/null || base=""
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- packages/content; then
            echo "content=unchanged" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Keep applied migrations unchanged
        if: steps.range.outputs.base != ''
        run: |
          changed="$(git diff --name-status --diff-filter=a "$BASE" HEAD -- apps/web/migrations)"
          if [ -n "$changed" ]; then
            echo "::error::Migrations are append-only. Add apps/web/migrations/000N_*.sql instead of changing:"
            echo "$changed"
            exit 1
          fi
        env:
          BASE: ${{ steps.range.outputs.base }}

      - name: Lint workflows
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate the reviewed release version
        run: bun run release:check
        env:
          RELEASE_BASE_REF: ${{ steps.range.outputs.base }}

      - name: Lint and formatting
        run: bunx biome ci --reporter=github .

      - name: Typecheck
        run: bun run typecheck

      - name: Unit, D1, and component tests
        run: bun run test

      # PR-only: source sites change without a code change, and shouldn't block deploying a
      # change that already passed review.
      - name: Restore cited source texts
        if: github.event_name == 'pull_request' && steps.range.outputs.content != 'unchanged'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/content/.cache
          key: content-sources-${{ hashFiles('packages/content/src/sources.ts') }}

      - name: Verify quotes against their sources
        if: github.event_name == 'pull_request' && steps.range.outputs.content != 'unchanged'
        run: bun run content:verify-sources

  dependencies:
    name: Dependency vulnerabilities
    # PR-only, like the source check: advisories change without a code change, and shouldn't
    # block deploying a change that already passed review.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Fail on fixable or critical vulnerabilities
        run: bun run audit:dependencies

  build:
    name: Build and browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build, public asset allowlist, and size budgets
        run: bun run build

      - name: Test browser package cache verification
        run: python3 -m unittest discover -s tools/ci -p 'test_*.py'

      - name: Name the browser package cache
        id: browser-packages
        working-directory: apps/web
        run: |
          playwright_version="$(bun -p "require('@playwright/test/package.json').version")"
          echo "key=browser-packages-v1-$RUNNER_ARCH-$ImageOS-$ImageVersion-playwright-$playwright_version" >> "$GITHUB_OUTPUT"

      - name: Restore the browsers' Ubuntu packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/browser-packages/*.deb
          key: ${{ steps.browser-packages.outputs.key }}

      - name: Install Chromium and WebKit
        working-directory: apps/web
        run: |
          # APT checks only the size of existing archives, so verify their bytes before root installs them.
          sudo apt-get update --error-on=any
          python3 ../../tools/ci/restore_browser_packages.py \
            "$HOME/browser-packages" "$RUNNER_TEMP/verified-browser-packages"
          shopt -s nullglob
          verified=("$RUNNER_TEMP/verified-browser-packages/"*.deb)
          if ((${#verified[@]})); then sudo install -m 644 -- "${verified[@]}" /var/cache/apt/archives/; fi
          bunx playwright install --with-deps --only-shell chromium webkit
          rm -rf ~/browser-packages
          mkdir -p ~/browser-packages
          fetched=(/var/cache/apt/archives/*.deb)
          if ((${#fetched[@]})); then cp "${fetched[@]}" ~/browser-packages/; fi

      - name: Browser smoke tests against the production build
        working-directory: apps/web
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Browser benchmarks and performance regression guards
        working-directory: apps/web
        run: bun run benchmark
        env:
          CI: true

      - name: Upload browser benchmark measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-benchmarks
          path: apps/web/benchmark-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the tested build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-build
          path: apps/web/dist
          # .assetsignore keeps wrangler.json and .dev.vars out of the public assets.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to somequote.com
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: prod
      url: https://somequote.com
    concurrency:
      group: production
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      # A re-run of an old workflow must never put an older commit back in production.
      - name: Skip commits that are no longer main
        id: fresh
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_DEPLOY_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets in the prod environment (doc/operations.md, Credentials)."
            exit 1
          fi
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying ${GITHUB_SHA}: main is now ${head}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Checkout
        if: steps.fresh.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        if: steps.fresh.outputs.current == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install pinned Wrangler
        if: steps.fresh.outputs.current == 'true'
        run: bun install --frozen-lockfile

      - name: Require an unused version or the exact previously released commit
        if: steps.fresh.outputs.current == 'true'
        id: version
        working-directory: .
        run: |
          bun run release:check
          echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Download the tested build
        if: steps.fresh.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: apps/web/dist

      - name: Require the production D1 database
        if: steps.fresh.outputs.current == 'true'
        run: |
          if ! jq -e '.d1_databases[0].database_id | strings | length > 0' dist/worker/wrangler.json >/dev/null; then
            echo "::error::Add the database_id from 'wrangler d1 create somequote' to apps/web/wrangler.jsonc (doc/operations.md)."
            exit 1
          fi

      # Only the first deployment may proceed without a known rollback version.
      - name: Record the live version for rollback
        if: steps.fresh.outputs.current == 'true'
        id: previous
        run: |
          workers="$(curl -sSf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          if ! printf '%s' "$workers" | jq -e '.success == true' >/dev/null; then
            echo "::error::Couldn't list the account's Workers. Check CLOUDFLARE_DEPLOY_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          if ! printf '%s' "$workers" | jq -e '.result | any(.id == "somequote")' >/dev/null; then
            echo "::notice::First deploy: the somequote Worker doesn't exist yet, so there is nothing to roll back to."
            exit 0
          fi
          status="$(bunx wrangler deployments status --json)"
          version="$(printf '%s' "$status" | jq -r '.versions[0].version_id // empty')"
          if [ -z "$version" ]; then
            echo "::error::Couldn't read the live Worker version to roll back to, so nothing was deployed. Check CLOUDFLARE_DEPLOY_TOKEN."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Live version before deploy: $version"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        if: steps.fresh.outputs.current == 'true'
        run: bun run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sync the quote collection
        if: steps.fresh.outputs.current == 'true'
        run: bun run db:seed:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        if: steps.fresh.outputs.current == 'true'
        run: |
          message="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c 1-100)"
          bunx wrangler deploy --config dist/worker/wrangler.json \
            --message "${TAG} ${GITHUB_SHA::12}: ${message:-Production deploy}" --tag "$TAG"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test somequote.com
        if: steps.fresh.outputs.current == 'true'
        id: smoke
        run: bun run smoke https://somequote.com

      # Migrations are append-only, so the previous version still runs against the new schema.
      - name: Roll back a failed deploy
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.version != ''
        id: rollback
        run: |
          bunx wrangler rollback "$VERSION" --name somequote \
            --message "Smoke test failed for ${GITHUB_SHA::12}"
          echo "::error::Smoke test failed; rolled back to $VERSION"
        env:
          VERSION: ${{ steps.previous.outputs.version }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Reports only; this run stays failed and takes no further action either way.
      - name: Check production after the rollback
        if: failure() && steps.rollback.outcome == 'success'
        run: |
          if bun run smoke https://somequote.com; then
            echo "::notice::Production is healthy again on $VERSION."
          else
            echo "::error::Production still fails on the previous version, so this deploy is probably not the cause. Check Cloudflare status and D1."
          fi
        env:
          VERSION: ${{ steps.previous.outputs.version }}

  release:
    name: Release the verified production deployment
    if: needs.deploy.outputs.tag != ''
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout the deployed commit and release tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish the GitHub release
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            tagged="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG belongs to $tagged, not deployed commit $GITHUB_SHA."
              exit 1
            fi
          fi
          released="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')"
          if grep -Fxq "$TAG" <<< "$released"; then
            echo "Release $TAG already exists for $GITHUB_SHA."
            exit 0
          fi
          notes="$(printf 'Verified deployment to https://somequote.com through the prod environment.\n\nCommit: %s\nActions run: %s/%s/actions/runs/%s\nCloudflare version tag: %s' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TAG")"
          jq -n --arg tag "$TAG" --arg sha "$GITHUB_SHA" --arg notes "$notes" \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $notes, generate_release_notes: true, make_latest: "legacy"}' \
            > "$RUNNER_TEMP/release.json"
          if ! url="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input "$RUNNER_TEMP/release.json" --jq .html_url)"; then
            echo "::error::Production deployed successfully, but release $TAG could not be published."
            echo "::notice::If GitHub rejects this older commit because its workflows differ from main, an owner must create tag $TAG at $GITHUB_SHA using their own account, then re-run only this release job (doc/operations.md, Release versions)."
            exit 1
          fi
          echo "### [$TAG]($url) deployed to [production](https://somequote.com)" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.deploy.outputs.tag }}
