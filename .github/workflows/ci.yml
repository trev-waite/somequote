name: CI/CD

# Pull requests run every check. A merge to main runs them again on the merged result, then
# deploys the exact build that passed them. Zone settings deploy separately (zone.yml), and
# secret scanning runs on every push without path filters (secrets.yml).
on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find the commits under review
        id: range
        run: |
          base="$PR_BASE"
          [ -n "$base" ] || base="$PUSH_BEFORE"
          # A new branch, force push, or manual run has no usable base: skip the migration check
          # and verify every quote's sources.
          git cat-file -e "${base}^{commit}" 2>/dev/null || base=""
          echo "base=$base" >> "$GITHUB_OUTPUT"
          if [ -n "$base" ] && git diff --quiet "$base" HEAD -- packages/content; then
            echo "content=unchanged" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Keep applied migrations unchanged
        if: steps.range.outputs.base != ''
        run: |
          changed="$(git diff --name-status --diff-filter=a "$BASE" HEAD -- apps/web/migrations)"
          if [ -n "$changed" ]; then
            echo "::error::Migrations are append-only. Add apps/web/migrations/000N_*.sql instead of changing:"
            echo "$changed"
            exit 1
          fi
        env:
          BASE: ${{ steps.range.outputs.base }}

      - name: Lint workflows
        run: |
          curl -sSfL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and formatting
        run: bunx biome ci --reporter=github .

      # PR-only, like the source check below: advisories and source sites change without a
      # code change, and neither should block deploying a change that already passed review.
      - name: Fail on fixable or critical vulnerabilities
        if: github.event_name == 'pull_request'
        run: bun run audit:dependencies

      - name: Typecheck
        run: bun run typecheck

      - name: Unit, D1, and component tests
        run: bun run test

      - name: Restore cited source texts
        if: github.event_name == 'pull_request' && steps.range.outputs.content != 'unchanged'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/content/.cache
          key: content-sources-${{ hashFiles('packages/content/src/sources.ts') }}

      - name: Verify quotes against their sources
        if: github.event_name == 'pull_request' && steps.range.outputs.content != 'unchanged'
        run: bun run content:verify-sources

  build:
    name: Build and browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Production build, public asset allowlist, and size budgets
        run: bun run build

      - name: Install Chromium and WebKit
        working-directory: apps/web
        run: bunx playwright install --with-deps --only-shell chromium webkit

      - name: Browser smoke tests against the production build
        working-directory: apps/web
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

      - name: Browser benchmarks and performance regression guards
        working-directory: apps/web
        run: bun run benchmark
        env:
          CI: true

      - name: Upload browser benchmark measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-benchmarks
          path: apps/web/benchmark-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the tested build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-build
          path: apps/web/dist
          # .assetsignore keeps wrangler.json and .dev.vars out of the public assets.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to somequote.com
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      # A re-run of an old workflow must never put an older commit back in production.
      - name: Skip commits that are no longer main
        id: fresh
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_DEPLOY_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (doc/operations.md, Credentials)."
            exit 1
          fi
          head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying ${GITHUB_SHA}: main is now ${head}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout
        if: steps.fresh.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        if: steps.fresh.outputs.current == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install pinned Wrangler
        if: steps.fresh.outputs.current == 'true'
        run: bun install --frozen-lockfile

      - name: Download the tested build
        if: steps.fresh.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-build
          path: apps/web/dist

      - name: Require the production D1 database
        if: steps.fresh.outputs.current == 'true'
        run: |
          if ! jq -e '.d1_databases[0].database_id | strings | length > 0' dist/worker/wrangler.json >/dev/null; then
            echo "::error::Add the database_id from 'wrangler d1 create somequote' to apps/web/wrangler.jsonc (doc/operations.md)."
            exit 1
          fi

      # Only the first deployment may proceed without a known rollback version.
      - name: Record the live version for rollback
        if: steps.fresh.outputs.current == 'true'
        id: previous
        run: |
          workers="$(curl -sSf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts")"
          if ! printf '%s' "$workers" | jq -e '.success == true' >/dev/null; then
            echo "::error::Couldn't list the account's Workers. Check CLOUDFLARE_DEPLOY_TOKEN and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          if ! printf '%s' "$workers" | jq -e '.result | any(.id == "somequote")' >/dev/null; then
            echo "::notice::First deploy: the somequote Worker doesn't exist yet, so there is nothing to roll back to."
            exit 0
          fi
          status="$(bunx wrangler deployments status --json)"
          version="$(printf '%s' "$status" | jq -r '.versions[0].version_id // empty')"
          if [ -z "$version" ]; then
            echo "::error::Couldn't read the live Worker version to roll back to, so nothing was deployed. Check CLOUDFLARE_DEPLOY_TOKEN."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Live version before deploy: $version"

      - name: Apply D1 migrations
        if: steps.fresh.outputs.current == 'true'
        run: bun run db:migrate:remote

      - name: Sync the quote collection
        if: steps.fresh.outputs.current == 'true'
        run: bun run db:seed:remote

      - name: Deploy
        if: steps.fresh.outputs.current == 'true'
        run: |
          message="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c 1-100)"
          bunx wrangler deploy --config dist/worker/wrangler.json \
            --message "${message:-Deploy ${GITHUB_SHA}}" --tag "${GITHUB_SHA::12}"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Smoke test somequote.com
        if: steps.fresh.outputs.current == 'true'
        id: smoke
        run: bun run smoke https://somequote.com

      # At most one rollback per run, and it can't start another: no step in any workflow pushes,
      # dispatches, or redeploys, and the token is read-only (deployment-config.test.ts checks this).
      # Migrations are append-only, so the previous version still runs against the new schema.
      - name: Roll back a failed deploy
        if: failure() && steps.smoke.outcome == 'failure' && steps.previous.outputs.version != ''
        id: rollback
        run: |
          bunx wrangler rollback "$VERSION" --name somequote \
            --message "Smoke test failed for ${GITHUB_SHA::12}"
          echo "::error::Smoke test failed; rolled back to $VERSION"
        env:
          VERSION: ${{ steps.previous.outputs.version }}

      # Reports only; this run stays failed and takes no further action either way.
      - name: Check production after the rollback
        if: failure() && steps.rollback.outcome == 'success'
        run: |
          if bun run smoke https://somequote.com; then
            echo "::notice::Production is healthy again on $VERSION."
          else
            echo "::error::Production still fails on the previous version, so this deploy is probably not the cause. Check Cloudflare status and D1."
          fi
        env:
          VERSION: ${{ steps.previous.outputs.version }}
